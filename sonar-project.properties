# Identificación del proyecto en SonarCloud
# sonar.organization and sonar.projectKey are supplied by official CI variables.
# Local analysis must provide them explicitly; no personal organization is a repository source of truth.
sonar.projectName=AsistenciasUCO-Frontend
sonar.projectVersion=1.1.0

# Rutas de código fuente y pruebas
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/coverage/**,**/environments/**

# Exclusiones de cobertura (modelos, interfaces, DTOs, bootstrapping, mocks y layouts sin logica evaluable)
sonar.coverage.exclusions=**/*.model.ts,**/*.interface.ts,**/*.dto.ts,**/environments/**,**/main.ts,**/app.config.ts,**/app.routes.ts,**/testing/**,**/mocks/**,**/*layout*.component.ts

# Exclusiones de duplicados: solo código generado. mensajes-ui-codigos-remotos.ts lo escribe
# scripts/sync-mensajes-ui-catalogo.mjs (compuerta check:mensajes-ui-catalogo) y repite, por diseño, las claves de
# mensajes-ui.ts con su código remoto de MessageUcoLab (VAL MSG-06).
sonar.cpd.exclusions=src/app/core/messages/mensajes-ui-codigos-remotos.ts

# Reporte de cobertura (generado por karma-coverage)
sonar.javascript.lcov.reportPaths=coverage/gestio-asistencia-frontend/lcov.info

# Codificación
sonar.sourceEncoding=UTF-8
